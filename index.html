<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>أكواد مهرجان الكرازة 2025</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      width: 450px;
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 26px;
      color: #333;
    }
    h2 {
      margin-bottom: 20px;
      font-size: 18px;
      color: #666;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      text-align: center;
      margin-bottom: 15px;
    }
    input:focus { border-color: #4CAF50; }
    #result {
      font-size: 18px;
      margin-top: 15px;
    }
    .success {
      background: #4CAF50;
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
    }
    .blocked {
      background: #ff9800;
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      margin-top: 10px;
    }
    .not-found {
      color: red;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📖 أكواد مهرجان الكرازة 2025</h1>
    <h2>بـ "إيه أثبت على ما تعلمت"</h2>
    <input type="text" id="searchInput" placeholder="✍️ أدخل الاسم هنا...">
    <div id="result"></div>
  </div>

  <script>
    let data = [];

    // تحميل ملف JSON
    fetch("data.json")
      .then(response => response.json())
      .then(json => { data = json; });

    // دالة لتوحيد النص للبحث
    function normalize(text) {
      return text
        .replace(/[أإآا]/g, "ا") // توحيد الألف
        .replace(/ة/g, "ه")      // تحويل التاء المربوطة
        .replace(/\s+/g, '')     // إزالة المسافات
        .toLowerCase();
    }

    // البحث أثناء الكتابة
    document.getElementById("searchInput").addEventListener("input", function() {
      const input = this.value;
      const normalizedInput = normalize(input);

      if (normalizedInput.length < 2) {
        document.getElementById("result").innerHTML = "";
        return;
      }

      const found = data.find(item => normalize(item["الاسم"]).includes(normalizedInput));

      if (found) {
        if (found["الاشتراك"] === "TRUE") {
          document.getElementById("result").innerHTML = `
            <div class="success">
              ✅ الاسم: ${found["الاسم"]}<br>
              🎓 المرحلة: ${found["المرحلة"]}<br>
              🆔 الكود: ${found["الكود"]}
            </div>`;
        } else {
          document.getElementById("result").innerHTML = `
            <div class="blocked">
              🚫 ${found["الاسم"]}<br>
              تم حجب النتيجة. يرجى تسديد المبالغ المستحقة.
            </div>`;
        }
      } else {
        document.getElementById("result").innerHTML = 
          `<div class="not-found">❌ الاسم غير موجود</div>`;
      }
    });
  </script>
</body>
</html>
