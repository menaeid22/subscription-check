<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>أكواد مهرجان الكرازة 2025</title>
  <style>
    body {
      font-family: "Tahoma", sans-serif;
      background: #f4f6f9;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #2c3e50;
    }
    input, button {
      padding: 10px;
      font-size: 18px;
      margin: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background: #2980b9;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #3498db;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      color: #27ae60;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>أكواد مهرجان الكرازة 2025</h1>
  <input type="text" id="nameInput" placeholder="ادخل الاسم هنا">
  <button onclick="searchCode()">عرض الكود</button>
  <div id="result"></div>

  <script>
    async function searchCode() {
      let inputName = document.getElementById("nameInput").value.trim().toLowerCase();
      let resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "⏳ جاري البحث...";

      try {
        let response = await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vSNnTef3Y5OP88qu7qeLUbxmUukLz9bpWEEyKErXMLJ8KHFcWKn8Jt7E_yRJo49Cg/pub?gid=2051067971&single=true&output=csv");
        let data = await response.text();
        let rows = data.split("\n").map(r => r.split(","));

        // البحث المرن
        let found = rows.find(row => row[0] && row[0].toLowerCase().replace(/\s+/g, "").includes(inputName.replace(/\s+/g, "")));

        if (found) {
          resultDiv.innerHTML = "✅ الكود: " + found[1];
        } else {
          resultDiv.innerHTML = "❌ الاسم غير موجود";
        }
      } catch (error) {
        resultDiv.innerHTML = "⚠️ حصل خطأ في تحميل البيانات";
      }
    }
  </script>
</body>
</html>
