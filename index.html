<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اكواد مهرجان الكرازة 2025</title>
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      text-align: center;
      background: #f8f9fa;
      padding: 30px;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #8B0000;
    }
    h2 {
      font-size: 18px;
      margin-bottom: 25px;
      color: #333;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin: 5px;
    }
    button {
      background: #8B0000;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #a00000;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #006400;
    }
  </style>
</head>
<body>

  <h1>اكواد مهرجان الكرازة 2025</h1>
  <h2>بــ "إيه أثبت على ما تعلمت"</h2>

  <input type="text" id="searchName" placeholder="ادخل الاسم هنا">
  <button onclick="searchCode()">بحث</button>

  <div id="result"></div>

  <script>
    const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSNnTef3Y5OP88qu7qeLUbxmUukLz9bpWEEyKErXMLJ8KHFcWKn8Jt7E_yRJo49Cg/pub?gid=2051067971&single=true&output=csv";

    async function searchCode() {
      const name = document.getElementById("searchName").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "جارى البحث...";

      try {
        const response = await fetch(sheetURL);
        const data = await response.text();

        const rows = data.split("\n").map(row => row.split(","));
        let found = false;

        for (let i = 1; i < rows.length; i++) {
          if (rows[i][0] && rows[i][0].trim() === name) {
            resultDiv.innerHTML = "الكود: " + rows[i][1];
            found = true;
            break;
          }
        }

        if (!found) {
          resultDiv.innerHTML = "⚠️ الاسم غير موجود";
        }
      } catch (error) {
        resultDiv.innerHTML = "خطأ في تحميل البيانات";
      }
    }
  </script>

</body>
</html>
