<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>أكواد مهرجان الكرازة 2025</title>
  <style>
    body {
      font-family: "Tahoma", "Cairo", sans-serif;
      background: linear-gradient(to bottom, #f7f3e9, #e4dacd);
      text-align: center;
      direction: rtl;
      margin: 0;
      padding: 0;
    }
    header {
      background: #3c2f2f;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header img {
      height: 100px;
    }
    h1 {
      margin-top: 20px;
      font-size: 36px;
      color: #8b0000;
    }
    h2 {
      font-size: 22px;
      color: #333;
      margin-bottom: 30px;
    }
    input {
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #aaa;
      width: 250px;
      text-align: center;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: #8b0000;
      color: #fff;
      cursor: pointer;
      margin-left: 10px;
      transition: 0.3s;
    }
    button:hover {
      background: #a52a2a;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background: #fff;
      border-radius: 15px;
      display: inline-block;
      min-width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .blocked {
      color: red;
      font-weight: bold;
    }
    .success {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <img src="600x600bf-60.jpg" alt="شعار مهرجان الكرازة">
    <img src="new assuit st markos.png" alt="شعار كنيسة مارمرقس">
  </header>

  <h1>أكواد مهرجان الكرازة 2025</h1>
  <h2>﴿ اثبت على ما تعلمت ﴾</h2>

  <input type="text" id="searchInput" placeholder="اكتب الاسم أو الكود">
  <button onclick="searchData()">بحث</button>

  <div id="result" class="result" style="display:none;"></div>

  <script>
    // بيانات تجريبية (للتجربة)
    const data = [
      {name: "مينا", stage: "ثالثة", subscription: true, code: "1001"},
      {name: "مارينا", stage: "رابعة", subscription: false, code: "1002"},
      {name: "بطرس", stage: "ثانية", subscription: true, code: "1003"},
      {name: "كيرلس", stage: "أولى", subscription: false, code: "1004"}
    ];

    function searchData() {
      const input = document.getElementById("searchInput").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.style.display = "block";

      const person = data.find(p => p.name === input || p.code === input);

      if(person){
        if(person.subscription){
          resultDiv.innerHTML = `
            <div class="success">✅ البيانات متاحة</div>
            <p><strong>الاسم:</strong> ${person.name}</p>
            <p><strong>المرحلة:</strong> ${person.stage}</p>
            <p><strong>الكود:</strong> ${person.code}</p>
          `;
        } else {
          resultDiv.innerHTML = `
            <div class="blocked">❌ تم حجب النتيجة<br>يجري تسديد المبالغ المستحقة</div>
          `;
        }
      } else {
        resultDiv.innerHTML = `
          <div class="blocked">⚠️ الاسم أو الكود غير موجود</div>
        `;
      }
    }
  </script>
</body>
</html>
